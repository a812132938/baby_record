name: Feature request
description: Propose a focused product or self-hosting improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or operator problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Data, privacy, or compatibility impact
      description: Note changes to stored data, AI processing, migrations, or supported environments.
    validations:
      required: true

