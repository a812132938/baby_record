# Replace example.com and both TLS paths before installation.
# If a CDN or load balancer is used, configure trusted proxy ranges separately;
# never trust arbitrary X-Forwarded-For or vendor ranges copied from an old file.

limit_req_zone $binary_remote_addr zone=baby_create_per_ip:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=baby_claim_per_ip:10m rate=10r/m;
map $request_method $baby_ai_write_key {
    default "";
    POST $binary_remote_addr;
}
limit_req_zone $baby_ai_write_key zone=baby_ai_write_per_ip:10m rate=12r/m;
limit_conn_zone $binary_remote_addr zone=baby_ai_stream_per_ip:10m;

upstream baby_record_backend {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com;
    return 301 https://example.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name example.com;

    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/baby-record/current;
    index index.html;
    client_max_body_size 32k;
    limit_req_status 429;

    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=15552000" always;

    location = /api/v1/auth/family/create {
        limit_req zone=baby_create_per_ip burst=5 nodelay;
        include proxy_params;
        proxy_pass http://baby_record_backend;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location = /api/v1/auth/device/claim {
        limit_req zone=baby_claim_per_ip burst=5 nodelay;
        include proxy_params;
        proxy_pass http://baby_record_backend;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location ~ ^/api/v1/babies/[0-9]+/stream$ {
        include proxy_params;
        proxy_pass http://baby_record_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering "no" always;
    }

    location ~ ^/api/v1/babies/[0-9]+/ai/conversations/[0-9]+/messages/[0-9]+/stream$ {
        limit_conn baby_ai_stream_per_ip 8;
        include proxy_params;
        proxy_pass http://baby_record_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        add_header Cache-Control "no-cache, no-store, no-transform" always;
        add_header X-Accel-Buffering "no" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
    }

    location ~ ^/api/v1/babies/[0-9]+/ai/ {
        limit_req zone=baby_ai_write_per_ip burst=6 nodelay;
        include proxy_params;
        proxy_pass http://baby_record_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
    }

    location /api/ {
        include proxy_params;
        proxy_pass http://baby_record_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location ~ ^/(?:sw\.js|registerSW\.js|manifest\.webmanifest|index\.html)$ {
        try_files $uri =404;
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Service-Worker-Allowed "/" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
