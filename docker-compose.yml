services:
  database:
    image: mariadb:${MARIADB_IMAGE_VERSION:-11.4.12}
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
      MARIADB_DATABASE: ${DB_NAME:-baby_record}
      MARIADB_USER: ${DB_USERNAME:-baby}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      TZ: ${APP_TIMEZONE:-Asia/Shanghai}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - baby_mysql_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 30

  server:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      DB_URL: "jdbc:mariadb://${DB_HOST:-database}:${DB_PORT:-3306}/${DB_NAME:-baby_record}"
      DB_USERNAME: ${DB_USERNAME:-baby}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      APP_SECURE_COOKIE: ${APP_SECURE_COOKIE:-true}
      APP_CORS_ALLOWED_ORIGIN_PATTERNS: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:?Set APP_CORS_ALLOWED_ORIGIN_PATTERNS in .env}
      APP_AUTH_SESSION_DAYS: ${APP_AUTH_SESSION_DAYS:?Set APP_AUTH_SESSION_DAYS in .env}
      APP_AUTH_CREATION_RECOVERY_MINUTES: ${APP_AUTH_CREATION_RECOVERY_MINUTES:?Set APP_AUTH_CREATION_RECOVERY_MINUTES in .env}
      AI_ENABLED: ${AI_ENABLED:-false}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      DEEPSEEK_ATTEMPT_TIMEOUT_SECONDS: ${DEEPSEEK_ATTEMPT_TIMEOUT_SECONDS:-90}
      DEEPSEEK_TOTAL_TIMEOUT_SECONDS: ${DEEPSEEK_TOTAL_TIMEOUT_SECONDS:-90}
      AI_STREAM_HEARTBEAT_INTERVAL_MS: ${AI_STREAM_HEARTBEAT_INTERVAL_MS:-10000}
      REALTIME_HEARTBEAT_INTERVAL_MS: ${REALTIME_HEARTBEAT_INTERVAL_MS:-20000}
      TZ: ${APP_TIMEZONE:-Asia/Shanghai}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/v1/health | grep -q ok"]
      interval: 8s
      timeout: 3s
      retries: 30

  web:
    build:
      context: ./web
    restart: unless-stopped
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_HOST_PORT:-8088}:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  baby_mysql_data:
